[tool.pyink]
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = true
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytype]
inputs = ["tapeheads", "tools", "tests"]
python_version = "3.11"
jobs = 4
